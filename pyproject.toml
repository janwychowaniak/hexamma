[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hexamma"
version = "0.2.0"
description = "Render a directory tree as a Graphviz diagram."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Jan Wychowaniak", email = "43786923+janwychowaniak@users.noreply.github.com" },
]
keywords = ["graphviz", "tree", "directory", "diagram", "visualization"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: Software Development",
    "Topic :: Utilities",
]
dependencies = [
    "graphviz >= 0.20",
]

[project.urls]
Homepage = "https://github.com/janwychowaniak/hexamma"
Repository = "https://github.com/janwychowaniak/hexamma"
Issues = "https://github.com/janwychowaniak/hexamma/issues"

[project.scripts]
hexamma = "hexamma.cli:main"

[dependency-groups]
dev = [
    "pytest >= 7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/hexamma"]

[tool.pytest.ini_options]
testpaths = ["tests"]
