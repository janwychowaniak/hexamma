[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hexamma"
version = "0.2.0"
description = "Render a directory tree as a Graphviz diagram."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Jan Wychowaniak", email = "43786923+janwychowaniak@users.noreply.github.com" },
]
keywords = ["graphviz", "tree", "directory", "diagram", "visualization"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: Software Development",
    "Topic :: Utilities",
]
dependencies = [
    "graphviz >= 0.20",
    "typer >= 0.9",
]

[project.urls]
Homepage = "https://github.com/janwychowaniak/hexamma"
Repository = "https://github.com/janwychowaniak/hexamma"
Issues = "https://github.com/janwychowaniak/hexamma/issues"

[project.scripts]
hexamma = "hexamma.cli:main"

[dependency-groups]
dev = [
    "pytest >= 7",
    "ruff >= 0.6",
    "mypy >= 1.10",
]

[tool.hatch.build.targets.wheel]
packages = ["src/hexamma"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
]

[tool.ruff.format]
quote-style = "single"

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = "graphviz.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["test_cli", "test_json_output", "test_mermaid", "test_render", "test_styling", "test_tree"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
